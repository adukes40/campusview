[project]
name = "campusview-loader"
version = "0.0.0"
description = "Load Infinite Campus CSV extracts into CampusView."
requires-python = "==3.12.*"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
